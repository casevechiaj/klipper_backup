[filament_switch_sensor fil_det]
switch_pin: EBB36:PD0
pause_on_runout: True
runout_distance: 0
event_delay: 3.0
pause_delay: 0.5


[multi_pin cooling_fan_pins]
pins: EBB36:PD3, EBB36:PA5

[fan fan]
pin: multi_pin:cooling_fan_pins
fan_speed: 1.0
kick_start_time: 0.5

# [fan]
# pin: EBB36:PD3
# kick_start_time: 0.5

[heater_fan hotend_fan]
pin: EBB36:PD2
#tachometer_pin: EBB:PA4
heater: extruder
heater_temp: 50.0
fan_speed: 1

